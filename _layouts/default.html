<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% if page.title and page.title != site.title %}
  <title>{{ page.title }} | {{ site.title }}</title>
  {% else %}
  <title>{{ site.title }}</title>
  {% endif %}
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/assets/images/brand/hr-mark.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/images/brand/apple-touch-icon.png' | relative_url }}">
  {% seo %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  {% include header.html %}
  <main class="default{% if page.title %} page-{{ page.title | slugify }}{% endif %}">
    {{ content }}
  </main>
   {% include footer.html %}
</body>
</html>
